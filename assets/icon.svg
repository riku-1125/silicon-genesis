<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19232e"/>
      <stop offset="100%" stop-color="#0b1016"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#c97828"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#8a6838" stroke-width="10"/>
  <!-- Copper pins -->
  <g stroke="#ffb84d" stroke-width="16" stroke-linecap="round">
    <line x1="76" y1="196" x2="156" y2="196"/>
    <line x1="76" y1="316" x2="156" y2="316"/>
    <line x1="392" y1="256" x2="444" y2="256"/>
  </g>
  <!-- NAND Gate symbol in industrial amber -->
  <path d="M156 146 H252 A110 110 0 0 1 252 366 H156 Z" fill="#18222d" stroke="url(#amber)" stroke-width="18" stroke-linejoin="round"/>
  <circle cx="380" cy="256" r="24" fill="#12382c" stroke="#52e3b6" stroke-width="14"/>
  <!-- Inner microchip core -->
  <rect x="194" y="216" width="80" height="80" rx="12" fill="#c97828" opacity="0.22" stroke="#ffb84d" stroke-width="6"/>
  <text x="234" y="266" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="30" fill="#ffd166">NAND</text>
</svg>
